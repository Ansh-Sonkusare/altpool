[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["vendor", "../../node_modules"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 10000
evm_version = "cancun"
remappings = [
  "@forshtat/hegota-support/=../../node_modules/@forshtat/hegota-support/",
  "forge-std/=../../node_modules/forge-std/src/",
  "ethfalcon/=vendor/ethfalcon/src/",
  "InterfaceVerifier/=vendor/InterfaceVerifier/src/",
  "sstore2/=vendor/sstore2/contracts/",
]
allow_paths = ["../../node_modules"]
fs_permissions = [{ access = "read", path = "test" }]
