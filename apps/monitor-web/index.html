<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Altpool monitor</title>
    <style>
      :root {
        --bg: #f7f7f5; --panel: #ffffff; --ink: #17171a; --muted: #6b6b73; --line: #e4e4e0;
        --ok: #1f8a4c; --warn: #b7791f; --bad: #c53030; --accent: #2c6fd1; --bar: #e9e9e4;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #111113; --panel: #1a1a1d; --ink: #ececef; --muted: #9a9aa3; --line: #2a2a2f; --ok: #48bb78; --warn: #ecc94b; --bad: #fc8181; --accent: #63a4ff; --bar: #2a2a2f; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
      header { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
      h1 { font-size: 18px; margin: 0; }
      h1 small { color: var(--muted); font-weight: 400; margin-left: 6px; }
      form { display: flex; gap: 8px; flex: 1 1 420px; max-width: 560px; }
      input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
      button { padding: 8px 14px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
      .muted { color: var(--muted); }
      .status-line { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12.5px; margin-bottom: 16px; overflow-wrap: anywhere; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
      .dot.live { background: var(--ok); animation: pulse 2s infinite; }
      .dot.err { background: var(--bad); }
      @keyframes pulse { 50% { opacity: .35; } }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 12px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
      .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
      .big { font-size: 22px; font-weight: 650; }
      .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid currentColor; }
      .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
      .bar { height: 8px; background: var(--bar); border-radius: 4px; overflow: hidden; margin: 8px 0 6px; }
      .bar > span { display: block; height: 100%; background: var(--ok); }
      .bar > span.warn { background: var(--warn); } .bar > span.bad { background: var(--bad); }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top; }
      th { font-size: 12px; color: var(--muted); font-weight: 600; border-top: 0; }
      td.num, th.num { text-align: right; }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
      .empty { color: var(--muted); padding: 6px 0; }
      .note { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
      .scroll { overflow-x: auto; }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
